<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divenic — Pilih Gender Anda.">
  <title>Pilih Gender — Divenic</title>
  <link rel="icon" href="asset/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="flow-body">

  <!-- Guard Redirect Script -->
  <script type="module">
    import { guardSession } from './js/services/session.service.js';
    guardSession('mode', 'landing.html');
  </script>

  <div class="flow-container" style="max-width: 520px;">
    <img src="asset/logo.png" alt="Divenic Logo" class="flow-logo">
    <h1 class="flow-title">PILIH GENDER</h1>
    <p class="flow-subtitle">Pilih bagian yearbook yang ingin Anda jelajahi</p>

    <div class="gender-grid">
      <div class="gender-card male" id="card-male">
        <span class="gender-icon"><i class="fa-solid fa-mars"></i></span>
        <span class="gender-label">Divenic Putra</span>
      </div>
      <div class="gender-card female" id="card-female">
        <span class="gender-icon"><i class="fa-solid fa-venus"></i></span>
        <span class="gender-label">Divenic Putri</span>
      </div>
    </div>

    <button id="btn-back" class="flow-btn secondary">Kembali</button>
  </div>

  <script type="module">
    import { setSession, getSession } from './js/services/session.service.js';

    document.addEventListener('DOMContentLoaded', () => {
      const cardMale = document.getElementById('card-male');
      const cardFemale = document.getElementById('card-female');
      const btnBack = document.getElementById('btn-back');

      cardMale.addEventListener('click', () => {
        setSession({ mode: 'guest', gender: 'male', memberId: null, nickname: 'Tamu' });
        window.location.href = 'loading.html';
      });

      cardFemale.addEventListener('click', () => {
        setSession({ gender: 'female' });
        window.location.href = 'coming-soon.html';
      });

      btnBack.addEventListener('click', () => {
        window.location.href = 'landing.html';
      });
    });
  </script>

</body>

</html>
