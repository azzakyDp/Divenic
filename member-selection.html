<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divenic — Pilih Identitas Member Anda.">
  <title>Pilih Member — Divenic</title>
  <link rel="icon" href="asset/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="flow-body">

  <!-- Guard Redirect Script -->
  <script type="module">
    import { guardSession, getSession } from './js/services/session.service.js';
    guardSession('gender', 'gender.html');

    const session = getSession();
    if (session.mode === 'guest') {
      window.location.replace('loading.html');
    }
  </script>

  <div class="flow-container selection-container">
    <img src="asset/logo.png" alt="Divenic Logo" class="flow-logo">
    <h1 class="flow-title">SIAPA ANDA?</h1>
    <p class="flow-subtitle">Pilih nama Anda untuk melanjutkan ke Buku Kenangan</p>

    <!-- Search & Filters Container -->
    <div class="selection-controls">
      <!-- Search Input -->
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="member-search" class="search-input" placeholder="Cari nama Anda...">
      </div>

      <!-- Alphabetical Jump Links -->
      <div class="alpha-filter" id="alpha-filter">
        <!-- Generated by JS -->
      </div>

      <!-- Category Filter Tabs -->
      <div class="cat-filters" id="cat-filters">
        <button class="cat-btn active" data-class="all">Semua Kelas</button>
        <button class="cat-btn" data-class="IPA">XII IPA</button>
        <button class="cat-btn" data-class="Agama">XII Agama</button>
      </div>
    </div>

    <!-- Member Selection Grid -->
    <div class="selection-grid" id="selection-grid">
      <p style="grid-column: span 3; text-align: center; color: var(--mid-grey); padding: var(--space-xl);">Memuat
        member...</p>
    </div>

    <!-- Action Buttons -->
    <div class="wizard-buttons" style="max-width: 320px; margin: 0 auto;">
      <button id="btn-back" class="flow-btn secondary" style="flex: 1;">Kembali</button>
      <button id="btn-next" class="flow-btn" style="flex: 1.5;" disabled>Lanjutkan</button>
    </div>
  </div>

  <script type="module">
    import { setSession, getSession } from './js/services/session.service.js';
    import { API_BASE, fetchData, debounce } from './js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('selection-grid');
      const btnBack = document.getElementById('btn-back');
      const btnNext = document.getElementById('btn-next');
      const searchInput = document.getElementById('member-search');
      const alphaFilterContainer = document.getElementById('alpha-filter');
      const catFilters = document.querySelectorAll('.cat-btn');

      let allMembers = [];
      let filteredMembers = [];
      let selectedMember = null;
      let activeCardElement = null;
      let activeAlpha = '';
      let activeClass = 'all';
      let offset = 0;
      const BATCH_SIZE = 12; // Batch 12: Kelipatan sempurna 2, 3, 4 kolom grid

      let sentinelObserver = null;

      // Root Cause Fix (LANGKAH 2): Single outer-scope virtualizationObserver instance (not recreated per renderGrid).
      // Reduced rootMargin from 400px to 150px 0px to prevent simultaneous decode/paint bursts on 12+ images.
      const virtualizationObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const card = entry.target;
          const img = card.querySelector('img.select-avatar');
          if (!img || !img.dataset.avatarSrc) return;

          if (entry.isIntersecting) {
            if (img.src !== img.dataset.avatarSrc) {
              img.src = img.dataset.avatarSrc;
            }
          } else {
            if (img.src !== 'asset/icons/person.png') {
              img.src = 'asset/icons/person.png';
            }
          }
        });
      }, { rootMargin: '150px 0px', threshold: 0.01 });

      // Load session
      const session = getSession();

      // Fetch member data
      try {
        const raw = await fetchData(`${API_BASE}/members`);

        // Filter by gender path
        allMembers = (raw || []).filter(m => m.gender === session.gender);
      } catch (e) {
        console.error('Error fetching members:', e);
        grid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: var(--rust);">Gagal memuat data member</p>';
      }

      // Back action
      btnBack.addEventListener('click', () => {
        window.location.href = 'gender.html';
      });

      // Next action
      btnNext.addEventListener('click', () => {
        if (!selectedMember) return;

        if (selectedMember.id === 'guest') {
          // Continue as guest
          setSession({
            mode: 'guest',
            memberId: null,
            nickname: 'Tamu'
          });
        } else {
          // Link member account
          setSession({
            mode: 'account',
            memberId: selectedMember.id,
            nickname: selectedMember.nickname || selectedMember.name.split(' ')[0]
          });
        }
        window.location.href = 'loading.html';
      });

      // Debounced search to maintain low INP during typing
      const debouncedRenderGrid = debounce(() => {
        renderGrid();
      }, 120);

      searchInput.addEventListener('input', debouncedRenderGrid);

      // Category filters click
      catFilters.forEach(btn => {
        btn.addEventListener('click', () => {
          catFilters.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeClass = btn.dataset.class;
          renderGrid();
        });
      });

      // Build alphabet filter list dynamically
      function buildAlphabetFilter() {
        alphaFilterContainer.innerHTML = '';

        // Add 'All' option
        const allBtn = document.createElement('button');
        allBtn.className = 'alpha-btn active';
        allBtn.textContent = 'ALL';
        allBtn.addEventListener('click', () => {
          document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
          allBtn.classList.add('active');
          activeAlpha = '';
          renderGrid();
        });
        alphaFilterContainer.appendChild(allBtn);

        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        alphabet.forEach(char => {
          // Check if any member starts with this letter
          const hasMember = allMembers.some(m => m.name.toUpperCase().startsWith(char));
          if (!hasMember) return; // Only show active letters

          const btn = document.createElement('button');
          btn.className = 'alpha-btn';
          btn.textContent = char;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeAlpha = char;
            renderGrid();
          });
          alphaFilterContainer.appendChild(btn);
        });
      }

      // O(1) Event Delegation for select-card clicks (Low INP < 16ms)
      grid.addEventListener('click', e => {
        const card = e.target.closest('.select-card');
        if (!card) return;
        
        const id = card.dataset.id;
        const nameEl = card.querySelector('.select-name');
        const nickname = nameEl ? nameEl.textContent : 'Tamu';
        selectMemberCard(card, id, nickname);
      });

      // Keyboard navigation support for accessibility
      grid.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          const card = e.target.closest('.select-card');
          if (!card) return;
          e.preventDefault();
          const id = card.dataset.id;
          const nameEl = card.querySelector('.select-name');
          const nickname = nameEl ? nameEl.textContent : 'Tamu';
          selectMemberCard(card, id, nickname);
        }
      });

      // O(1) Card selection without looping through entire DOM (Style Recalc Tree limited to 2 nodes)
      function selectMemberCard(cardElement, id, nickname) {
        selectedMember = { id, nickname };

        if (activeCardElement && activeCardElement !== cardElement) {
          activeCardElement.classList.remove('active');
        }
        cardElement.classList.add('active');
        activeCardElement = cardElement;

        // Enable Next Button
        btnNext.removeAttribute('disabled');
      }

      function renderGrid() {
        if (sentinelObserver) sentinelObserver.disconnect();
        if (virtualizationObserver) virtualizationObserver.disconnect();

        grid.innerHTML = '';
        activeCardElement = null;
        offset = 0;

        const search = searchInput.value.trim().toLowerCase();

        filteredMembers = allMembers.filter(m => {
          const matchSearch = !search || m.name.toLowerCase().includes(search) || (m.nickname && m.nickname.toLowerCase().includes(search));
          const matchAlpha = !activeAlpha || m.name.toUpperCase().startsWith(activeAlpha);

          let matchClass = activeClass === 'all' || (m.class && m.class.includes(activeClass));
          return matchSearch && matchAlpha && matchClass;
        });

        // Render "Other / Bukan Member" card first
        const showGuest = !search || 'tamu'.includes(search) || 'bukan member'.includes(search) || 'lainnya'.includes(search);
        if (showGuest) {
          const otherCard = document.createElement('div');
          otherCard.className = 'select-card other ' + (selectedMember?.id === 'guest' ? 'active' : '');
          otherCard.dataset.id = 'guest';
          otherCard.setAttribute('role', 'button');
          otherCard.setAttribute('tabindex', '0');
          otherCard.innerHTML = `
            <i class="fa-solid fa-user-secret"></i>
            <div class="select-name">Bukan Member</div>
            <div class="select-class">Masuk sebagai Tamu</div>
          `;
          if (selectedMember?.id === 'guest') activeCardElement = otherCard;
          grid.appendChild(otherCard);
        }

        if (filteredMembers.length === 0 && !showGuest) {
          grid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: var(--mid-grey); padding: var(--space-xl);">Tidak ada nama yang cocok</p>';
          return;
        }

        // Sentinel element for 12-card batch infinite scroll
        const sentinel = document.createElement('div');
        sentinel.className = 'selection-sentinel';
        sentinel.style.cssText = 'grid-column: 1 / -1; height: 10px; margin: 10px 0; pointer-events: none;';
        grid.appendChild(sentinel);

        // Sentinel observer for infinite scroll
        sentinelObserver = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && offset < filteredMembers.length) {
            renderBatch(sentinel);
          }
        }, { rootMargin: '200px' });

        // Render initial 12-item batch
        renderBatch(sentinel);

        // Start observing sentinel
        sentinelObserver.observe(sentinel);
      }

      function renderBatch(sentinel) {
        const fragment = document.createDocumentFragment();
        const limit = Math.min(offset + BATCH_SIZE, filteredMembers.length);

        for (; offset < limit; offset++) {
          const m = filteredMembers[offset];
          const isSelected = selectedMember?.id === m.id;

          const card = document.createElement('div');
          card.className = 'select-card ' + (isSelected ? 'active' : '');
          card.dataset.id = m.id;
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');

          const nickname = m.nickname || m.name.split(' ')[0];

          // Direct DOM element creation with avatar placeholder & single outer virtualizationObserver (LANGKAH 2)
          const img = document.createElement('img');
          img.className = 'select-avatar';
          img.dataset.avatarSrc = m.avatar;
          img.src = 'asset/icons/person.png';
          img.setAttribute('loading', 'lazy');
          img.setAttribute('decoding', 'async');
          img.alt = nickname;
          img.onerror = () => { img.src = 'asset/icons/person.png'; };

          const nameDiv = document.createElement('div');
          nameDiv.className = 'select-name';
          nameDiv.textContent = nickname;

          const classDiv = document.createElement('div');
          classDiv.className = 'select-class';
          classDiv.textContent = m.class || 'Member';

          card.appendChild(img);
          card.appendChild(nameDiv);
          card.appendChild(classDiv);

          if (isSelected) activeCardElement = card;

          fragment.appendChild(card);
          virtualizationObserver.observe(card);
        }

        // Single append to main DOM tree via DocumentFragment (1 Reflow per batch)
        if (sentinel && sentinel.parentElement === grid) {
          grid.insertBefore(fragment, sentinel);
        } else {
          grid.appendChild(fragment);
        }
      }

      // Initial run
      buildAlphabetFilter();
      renderGrid();
    });
  </script>

</body>

</html>
