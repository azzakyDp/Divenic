<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divenic — Masuk ke Akun Anda.">
  <title>Divenic</title>
  <link rel="icon" href="asset/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="flow-body">

  <div class="flow-container">
    <img src="asset/logo.png" alt="Divenic Logo" class="flow-logo">
    <h1 class="flow-title">MASUK</h1>
    <p class="flow-subtitle">Kembali dan telusuri lembar kenangan</p>

    <form id="login-form" class="flow-form" novalidate>
      <div class="form-group" id="email-group">
        <label for="email" class="form-label">Email / Nickname</label>
        <input type="text" id="email" class="form-input" placeholder="nama@email.com atau nickname" required>
        <span class="validation-error" id="email-error">Masukkan email atau nickname yang valid</span>
      </div>

      <div class="form-group" id="password-group">
        <label for="password" class="form-label">Kata Sandi</label>
        <div class="password-input-wrap">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Tampilkan password">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
        <span class="validation-error" id="password-error">Masukkan kata sandi</span>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me"> Ingat Saya
        </label>
        <a href="#" class="flow-link" id="forgot-password-link">Lupa Sandi?</a>
      </div>

      <div style="margin-top: var(--space-md);">
        <span class="validation-error" id="general-error" style="text-align: center; margin-bottom: 8px;">Email/nickname
          atau kata sandi salah</span>
      </div>

      <div class="wizard-buttons" style="margin-top: var(--space-md);">
        <button type="button" id="btn-back" class="flow-btn secondary" style="flex: 1;">Kembali</button>
        <button type="submit" class="flow-btn" style="flex: 1.5;">Masuk</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { API_BASE, setupPasswordToggle } from './js/utils.js';
    import { setSession } from './js/services/session.service.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const btnBack = document.getElementById('btn-back');
      const forgotLink = document.getElementById('forgot-password-link');
      const generalError = document.getElementById('general-error');

      setupPasswordToggle(passwordInput, togglePasswordBtn);

      // Check if user is already authenticated -> redirect to main content
      try {
        const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data.userId) {
            const userGender = data.gender || 'male';
            setSession({
              mode: 'account',
              gender: userGender,
              memberId: data.memberId || null,
              nickname: data.name || ''
            });
            if (userGender === 'female') {
              window.location.replace('coming-soon.html');
            } else {
              window.location.replace('index.html');
            }
            return;
          }
        }
      } catch (e) {
        // Not logged in or network error, stay on login form
      }

      // Back to landing
      btnBack.addEventListener('click', () => {
        window.location.href = 'landing.html';
      });

      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Fitur Reset Kata Sandi belum tersedia. Hubungi admin kelas Anda!');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Reset error states
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));
        if (generalError) generalError.style.display = 'none';

        const identifier = emailInput.value.trim();
        const password = passwordInput.value;
        let hasError = false;

        if (!identifier) {
          document.getElementById('email-group').classList.add('has-error');
          hasError = true;
        }

        if (!password) {
          document.getElementById('password-group').classList.add('has-error');
          hasError = true;
        }

        if (hasError) return;

        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ identifier, password })
          });

          const data = await response.json();

          if (response.ok) {
            try {
              const meRes = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
              const meData = await meRes.json();

              if (meRes.ok) {
                const userGender = meData.gender || 'male';
                setSession({
                  mode: 'account',
                  gender: userGender,
                  memberId: meData.memberId || null,
                  nickname: meData.name || ''
                });

                if (userGender === 'female') {
                  window.location.href = 'coming-soon.html';
                } else {
                  window.location.href = 'loading.html';
                }
              } else {
                generalError.textContent = 'Gagal memuat data profil user.';
                generalError.style.display = 'block';
              }
            } catch (meErr) {
              console.error('Error fetching profile after login:', meErr);
              generalError.textContent = 'Gagal terhubung ke server saat memuat data profil.';
              generalError.style.display = 'block';
            }
          } else if (response.status === 401 || response.status === 423) {
            if (response.status === 423 || data.error === 'locked') {
              generalError.textContent = data.message || `Akun terkunci. Coba lagi dalam ${data.minutesLeft || 30} menit.`;
            } else {
              generalError.textContent = data.message || 'Email/nickname atau kata sandi salah';
            }
            generalError.style.display = 'block';
          } else if (response.status >= 500) {
            generalError.textContent = 'Terjadi kesalahan server, coba lagi nanti';
            generalError.style.display = 'block';
          } else {
            generalError.textContent = data.message || 'Terjadi kesalahan. Silakan coba lagi.';
            generalError.style.display = 'block';
          }
        } catch (err) {
          console.error('Error during login:', err);
          generalError.textContent = 'Tidak dapat terhubung ke server';
          generalError.style.display = 'block';
        }
      });
    });
  </script>

</body>

</html>
