<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Divenic — Pengaturan Profil Member Buku Tahunan.">
  <title>Dashboard Profil — Divenic</title>
  <link rel="icon" href="asset/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="flow-body">

  <div class="flow-container" style="max-width: 540px;">
    <!-- Top Header Bar -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <a href="index.html" class="flow-link" style="display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
      </a>
      <img src="asset/logo.png" alt="Divenic Logo" style="width: 36px; height: 36px;">
    </div>

    <h1 class="flow-title" style="text-align: left; margin-bottom: 4px;">DASHBOARD PROFIL</h1>
    <p class="flow-subtitle" style="text-align: left; margin-bottom: 24px;">Lengkapi data diri dan biodata Anda untuk buku tahunan</p>

    <!-- Profile Overview Card (Read-only) -->
    <div style="background: rgba(255, 255, 255, 0.7); border: 1px solid var(--color-border); border-radius: var(--card-radius); padding: 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 24px; box-shadow: var(--card-shadow);">
      <img id="profile-avatar" src="asset/icons/person.png" alt="Foto Profil" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid var(--copper); background: var(--warm-white);" />
      <div>
        <h2 id="profile-name" style="font-family: var(--font-display); font-size: var(--text-lg); color: var(--slate); margin: 0 0 4px 0;">Memuat nama...</h2>
        <span id="profile-class" style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: rgba(182, 93, 61, 0.12); color: var(--copper); font-size: var(--text-xs); font-weight: 700;">Memuat kelas...</span>
      </div>
    </div>

    <!-- Edit Profile Form -->
    <form id="profile-form" class="flow-form" novalidate>

      <!-- Division Field (Text input - isolated container for easy future swap to dropdown) -->
      <div class="form-group" id="division-group" style="margin-bottom: 18px;">
        <label for="division" class="form-label">Divisi Anda</label>
        <input type="text" id="division" class="form-input" placeholder="Masukkan divisi Anda (contoh: Acara, Humas, Konsumsi)...">
      </div>

      <!-- Bio Field (Textarea + Character Counter) -->
      <div class="form-group" id="bio-group" style="margin-bottom: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="bio" class="form-label" style="margin-bottom: 0;">Bio Singkat</label>
          <span style="font-size: var(--text-xs); color: var(--mid-grey);"><span id="bio-counter">0</span> / 150</span>
        </div>
        <textarea id="bio" class="form-input" rows="4" maxlength="150" placeholder="Tuliskan kata-kata atau biodata singkat Anda..." style="resize: vertical; font-family: var(--font-ui);"></textarea>
        <span class="validation-error" id="bio-error">Bio maksimal 150 karakter</span>
      </div>

      <!-- Instagram Field (Input with @ prefix wrapper) -->
      <div class="form-group" id="instagram-group" style="margin-bottom: 24px;">
        <label for="instagram" class="form-label">Akun Instagram</label>
        <div style="display: flex; align-items: center; border: 1.5px solid rgba(49, 78, 82, 0.15); border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.9); overflow: hidden; transition: border-color 0.2s;">
          <span style="padding: 12px 14px; background: rgba(49, 78, 82, 0.06); color: var(--mid-grey); font-weight: 700; font-size: var(--text-base); border-right: 1px solid rgba(49, 78, 82, 0.12);">@</span>
          <input type="text" id="instagram" class="form-input" style="border: none; border-radius: 0; background: transparent; padding-left: 12px;" placeholder="username_instagram">
        </div>
      </div>

      <!-- Toast Notification Container -->
      <div id="profile-toast" class="toast-notice" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 600; text-align: center; margin-bottom: 16px;"></div>

      <button type="submit" id="btn-save" class="flow-btn" style="width: 100%;">
        <i class="fa-solid fa-floppy-disk" style="margin-right: 6px;"></i> Simpan Perubahan
      </button>

    </form>
  </div>

  <script type="module">
    import { API_BASE, fetchData } from './js/utils.js';
    import { optimazeCloudinary } from './js/services/asset.service.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const avatarImg = document.getElementById('profile-avatar');
      const nameEl = document.getElementById('profile-name');
      const classEl = document.getElementById('profile-class');
      const divisionInput = document.getElementById('division');
      const bioTextarea = document.getElementById('bio');
      const bioCounter = document.getElementById('bio-counter');
      const instagramInput = document.getElementById('instagram');
      const form = document.getElementById('profile-form');
      const btnSave = document.getElementById('btn-save');
      const toast = document.getElementById('profile-toast');

      // Live Bio Character Counter
      bioTextarea.addEventListener('input', () => {
        const len = bioTextarea.value.length;
        bioCounter.textContent = len;
        if (len > 150) {
          bioCounter.style.color = 'var(--rust)';
        } else {
          bioCounter.style.color = 'var(--mid-grey)';
        }
      });

      // Helper function to show toast message
      function showToast(message, isSuccess = true) {
        toast.textContent = message;
        if (isSuccess) {
          toast.style.background = 'rgba(122, 158, 126, 0.18)';
          toast.style.color = 'var(--slate)';
          toast.style.border = '1.5px solid var(--sage)';
        } else {
          toast.style.background = 'rgba(139, 58, 30, 0.15)';
          toast.style.color = 'var(--rust)';
          toast.style.border = '1.5px solid var(--rust)';
        }
        toast.style.display = 'block';

        setTimeout(() => {
          toast.style.display = 'none';
        }, 4000);
      }

      // Auth Guard & Fetch Initial Profile Data
      try {
        const profile = await fetchData(`${API_BASE}/profile/me`);
        if (!profile || profile.error) {
          // Guard: Redirect to login.html if unauthorized/not logged in
          window.location.replace('login.html');
          return;
        }

        // Render read-only header
        nameEl.textContent = profile.name || profile.nickname || 'Member Divenic';
        classEl.textContent = profile.class || 'Member';
        if (profile.avatar) {
          avatarImg.src = optimazeCloudinary(profile.avatar, 144, 144);
        } else {
          avatarImg.src = 'asset/icons/person.png';
        }
        avatarImg.onerror = () => { avatarImg.src = 'asset/icons/person.png'; };

        // Render editable fields
        divisionInput.value = profile.division || '';
        bioTextarea.value = profile.bio || '';
        bioCounter.textContent = (profile.bio || '').length;
        instagramInput.value = profile.instagram || '';

      } catch (err) {
        console.error('Error fetching profile:', err);
        window.location.replace('login.html');
        return;
      }

      // Handle Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        toast.style.display = 'none';

        const division = divisionInput.value.trim();
        const bio = bioTextarea.value.trim();
        let instagram = instagramInput.value.trim();

        if (instagram.startsWith('@')) {
          instagram = instagram.substring(1).trim();
        }

        if (bio.length > 150) {
          showToast('Bio tidak boleh melebihi 150 karakter', false);
          return;
        }

        btnSave.disabled = true;
        btnSave.style.opacity = '0.7';
        btnSave.textContent = 'Menyimpan...';

        try {
          const res = await fetch(`${API_BASE}/profile/me`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ division, bio, instagram })
          });

          const data = await res.json();

          if (res.ok) {
            showToast('Profil Anda berhasil diperbarui!', true);
          } else {
            showToast(data.message || 'Gagal memperbarui profil. Periksa data Anda.', false);
          }
        } catch (err) {
          console.error('Error submitting profile update:', err);
          showToast('Terjadi kesalahan jaringan. Coba lagi.', false);
        } finally {
          btnSave.disabled = false;
          btnSave.style.opacity = '1';
          btnSave.innerHTML = '<i class="fa-solid fa-floppy-disk" style="margin-right: 6px;"></i> Simpan Perubahan';
        }
      });
    });
  </script>

</body>

</html>
