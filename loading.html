<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divenic</title>
  <link rel="icon" href="asset/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/flow.css">
</head>

<body class="flow-body" style="background: var(--cream);">

  <!-- Guard Redirect Script -->
  <script type="module">
    import { guardSession } from './js/services/session.service.js';
    guardSession('gender', 'login.html');
  </script>

  <div class="flow-container flow-loading">
    <img src="asset/logo.png" alt="Divenic Logo" class="flow-logo" style="animation: pulse 1.5s ease-in-out infinite;">

    <h2 class="flow-title" style="font-size: var(--text-2xl);" id="loading-title">Menyiapkan Kenangan</h2>
    <p class="flow-subtitle" id="loading-status" style="margin-bottom: 0;">Menghubungkan masa lalu...</p>

    <div class="loading-bar-wrap">
      <div class="loading-bar-progress" id="progress-fill"></div>
    </div>
  </div>

  <style>
    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(0.97);
      }
    }
  </style>

  <script type="module">
    import { shouldPlayIntro } from './js/services/intro.service.js';

    document.addEventListener('DOMContentLoaded', () => {
      const fill = document.getElementById('progress-fill');
      const statusText = document.getElementById('loading-status');

      const statuses = [
        'Membuka folder kenangan...',
        'Memuat senyum dan canda tawa...',
        'Menyusun perjalanan kelas...',
        'Menghidupkan kembali nostalgia...',
        'Selesai! Selamat menikmati...'
      ];

      let progress = 0;
      let statusIdx = 0;
      const totalDuration = 2000; // 2 seconds total loading
      const intervalTime = 40; // update progress every 40ms
      const steps = totalDuration / intervalTime;
      const stepSize = 100 / steps;

      const timer = setInterval(() => {
        progress += stepSize;
        if (progress > 100) progress = 100;

        fill.style.transform = `scaleX(${progress / 100})`;

        // Change text based on progress
        const textIdx = Math.floor((progress / 100) * statuses.length);
        if (textIdx !== statusIdx && textIdx < statuses.length) {
          statusIdx = textIdx;
          statusText.textContent = statuses[statusIdx];
        }

        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 200);
        }
      }, intervalTime);
    });
  </script>

</body>

</html>
